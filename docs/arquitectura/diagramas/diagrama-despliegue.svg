  <polygon points="1020.0,352.0 1031.0,347.0 1031.0,357.0" fill="#37474f"/>
  <polygon points="690.0,236.0 685.0,225.0 695.0,225.0" fill="#37474f"/>
  <polygon points="690.0,630.0 685.0,619.0 695.0,619.0" fill="#37474f"/>
  <polygon points="1355.0,500.0 1350.0,489.0 1360.0,489.0" fill="#37474f"/>
