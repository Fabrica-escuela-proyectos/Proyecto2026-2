<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1570 900" width="1570" height="900" font-family="Arial, Helvetica, sans-serif">
  <title>Diagrama de despliegue — Plataforma de Reservas de Servicios (Sprint 2)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78909c"/>
    </marker>
  </defs>
  <rect width="1570" height="900" fill="#ffffff"/>

  <text x="785" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0d1b2a">Diagrama de despliegue — Plataforma de Reservas de Servicios (Sprint 2)</text>
  <text x="785" y="58" text-anchor="middle" font-size="13" fill="#546e7a">Notación UML: nodos (cajas con pestaña de estereotipo), artefactos (documento), rutas de comunicación (flechas con protocolo). Línea discontinua = relación de construcción/automatización o elemento futuro.</text>

  <!-- ================= CLIENTE ================= -->
  <g>
    <rect x="30" y="110" width="250" height="330" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
    <text x="155" y="136" text-anchor="middle" font-size="12" fill="#37474f">«device»</text>
    <text x="155" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d1b2a">Cliente</text>
    <rect x="48" y="176" width="214" height="62" rx="4" fill="#ffffff" stroke="#607d8b"/>
    <text x="155" y="200" text-anchor="middle" font-size="13" font-weight="bold">Navegador web</text>
    <text x="155" y="220" text-anchor="middle" font-size="12" fill="#455a64">Swagger UI (/swagger-ui.html)</text>
    <rect x="48" y="252" width="214" height="62" rx="4" fill="#ffffff" stroke="#607d8b"/>
    <text x="155" y="276" text-anchor="middle" font-size="13" font-weight="bold">Postman / Newman</text>
    <text x="155" y="296" text-anchor="middle" font-size="12" fill="#455a64">pruebas de Calidad (REST)</text>
    <rect x="48" y="328" width="214" height="62" rx="4" fill="#fafafa" stroke="#90a4ae" stroke-dasharray="6,4"/>
    <text x="155" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#78909c">Frontend web / móvil</text>
    <text x="155" y="372" text-anchor="middle" font-size="12" fill="#90a4ae">futuro (CORS_ALLOWED_ORIGINS)</text>
    <text x="155" y="420" text-anchor="middle" font-size="12" fill="#546e7a">Todo tráfico lleva JWT (Bearer)</text>
  </g>

  <!-- ================= RENDER ================= -->
  <g>
    <rect x="330" y="90" width="720" height="760" rx="10" fill="#f3f8ff" stroke="#1565c0" stroke-width="2.5"/>
    <text x="350" y="116" font-size="12" fill="#1565c0">«cloud»</text>
    <text x="350" y="136" font-size="17" font-weight="bold" fill="#0d47a1">Render (plan gratuito)</text>
    <text x="1030" y="136" text-anchor="end" font-size="12" fill="#546e7a">https://proyecto2026-2-5zoo.onrender.com</text>

    <!-- proxy -->
    <rect x="360" y="156" width="660" height="46" rx="4" fill="#ffffff" stroke="#1565c0"/>
    <text x="690" y="176" text-anchor="middle" font-size="13" font-weight="bold">Proxy inverso de Render</text>
    <text x="690" y="194" text-anchor="middle" font-size="12" fill="#455a64">termina TLS · redirige HTTP→HTTPS · agrega X-Forwarded-For / -Proto</text>

    <!-- web service -->
    <rect x="360" y="236" width="660" height="340" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.8"/>
    <text x="380" y="258" font-size="12" fill="#1565c0">«execution environment» Web Service (Docker)</text>
    <text x="1000" y="258" text-anchor="end" font-size="12" fill="#546e7a">temurin:17-jre · usuario «app» (sin root) · HEALTHCHECK</text>

    <!-- artifact jar -->
    <rect x="380" y="272" width="620" height="290" rx="4" fill="#e8f1fb" stroke="#1565c0"/>
    <text x="396" y="294" font-size="12" fill="#1565c0">«artifact»</text>
    <text x="396" y="313" font-size="15" font-weight="bold" fill="#0d1b2a">reservas-backend.jar — Spring Boot 4.1.1 · Java 17 · monolito modular</text>

    <!-- capas transversales -->
    <rect x="396" y="326" width="588" height="44" rx="3" fill="#ffffff" stroke="#90a4ae"/>
    <text x="690" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">Filtros y seguridad (orden de ejecución)</text>
    <text x="690" y="361" text-anchor="middle" font-size="11.5" fill="#455a64">Correlación (X-Request-Id) → tope 64 KB → CORS/cabeceras → JWT + sesión → MFA → rol</text>

    <!-- módulos -->
    <rect x="396" y="382" width="116" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="454" y="402" text-anchor="middle" font-size="13" font-weight="bold">identity</text>
    <text x="454" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">HU-01,02,04,05 · MFA</text>
    <rect x="522" y="382" width="116" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="580" y="402" text-anchor="middle" font-size="13" font-weight="bold">provider</text>
    <text x="580" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">HU-03,06,08</text>
    <rect x="648" y="382" width="116" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="706" y="402" text-anchor="middle" font-size="13" font-weight="bold">resource</text>
    <text x="706" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">HU-14,19 · 16,17*</text>
    <rect x="774" y="382" width="116" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="832" y="402" text-anchor="middle" font-size="13" font-weight="bold">service</text>
    <text x="832" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">HU-09,13,18,20</text>
    <rect x="900" y="382" width="84" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="942" y="402" text-anchor="middle" font-size="13" font-weight="bold">audit</text>
    <text x="942" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">eventos</text>
    <rect x="396" y="436" width="368" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="580" y="456" text-anchor="middle" font-size="13" font-weight="bold">reservation</text>
    <text x="580" y="472" text-anchor="middle" font-size="10.5" fill="#37474f">HU-22,23,24,25,26 · orquesta 16* y 28 · anti-overbooking</text>
    <rect x="774" y="436" width="210" height="44" rx="3" fill="#cfd8dc" stroke="#546e7a"/>
    <text x="879" y="456" text-anchor="middle" font-size="13" font-weight="bold">common</text>
    <text x="879" y="472" text-anchor="middle" font-size="10.5" fill="#37474f">ApiError · config · validación</text>

    <rect x="396" y="492" width="588" height="56" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-dasharray="5,3"/>
    <text x="690" y="511" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">Documentación y operación</text>
    <text x="690" y="528" text-anchor="middle" font-size="11.5" fill="#455a64">springdoc: /v3/api-docs + /swagger-ui.html (SWAGGER_ENABLED) · Actuator: solo /actuator/health público</text>
    <text x="690" y="543" text-anchor="middle" font-size="11.5" fill="#455a64">Logs JSON con traceId (perfil prod) · configuración por variables de entorno</text>

    <!-- database -->
    <rect x="360" y="630" width="660" height="196" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.8"/>
    <text x="380" y="652" font-size="12" fill="#1565c0">«database» PostgreSQL 16 administrado (Render, plan gratuito)</text>
    <rect x="380" y="668" width="314" height="140" rx="4" fill="#e8f1fb" stroke="#1565c0"/>
    <text x="396" y="690" font-size="12" fill="#1565c0">«schema» public (migraciones Flyway V1–V12)</text>
    <text x="396" y="712" font-size="12" fill="#37474f">users · roles · user_roles · sessions · mfa</text>
    <text x="396" y="730" font-size="12" fill="#37474f">providers · businesses · services</text>
    <text x="396" y="748" font-size="12" fill="#37474f">resources · service_resources · resource_availability</text>
    <text x="396" y="766" font-size="12" fill="#37474f">bookings (snapshots, cancel_origin) · audit_logs</text>
    <text x="396" y="790" font-size="12" font-weight="bold" fill="#37474f">UUID · TIMESTAMPTZ · ON DELETE SET NULL</text>
    <rect x="708" y="668" width="292" height="140" rx="4" fill="#fff8e1" stroke="#f9a825"/>
    <text x="722" y="690" font-size="12" fill="#8d6e00">Reglas en la base de datos</text>
    <text x="722" y="712" font-size="12" fill="#37474f">EXCLUDE USING gist (btree_gist):</text>
    <text x="722" y="730" font-size="12" fill="#37474f">un recurso no se reserva dos veces</text>
    <text x="722" y="748" font-size="12" fill="#37474f">en el mismo horario (ADR-005)</text>
    <text x="722" y="772" font-size="12" fill="#37474f">CHECK de rangos, estados y precios</text>
    <text x="722" y="790" font-size="12" fill="#37474f">Hibernate: ddl-auto = validate</text>
  </g>

  <!-- ================= GITHUB ================= -->
  <g transform="translate(70,0)">
    <rect x="1100" y="110" width="370" height="340" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
    <text x="1285" y="134" text-anchor="middle" font-size="12" fill="#24292f">«cloud»</text>
    <text x="1285" y="154" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d1117">GitHub</text>
    <rect x="1118" y="170" width="334" height="48" rx="4" fill="#ffffff" stroke="#6e7781"/>
    <text x="1285" y="191" text-anchor="middle" font-size="13" font-weight="bold">Repositorio (público) · rama main</text>
    <text x="1285" y="208" text-anchor="middle" font-size="11.5" fill="#57606a">Fabrica-escuela-proyectos/Proyecto2026-2 · PR + revisión</text>
    <rect x="1118" y="230" width="334" height="146" rx="4" fill="#e6f4ea" stroke="#2da44e"/>
    <text x="1135" y="250" font-size="12" fill="#1a7f37">«execution environment» GitHub Actions · ubuntu-latest</text>
    <text x="1135" y="272" font-size="12.5" font-weight="bold" fill="#24292f">CI/CD Pipeline (build.yml)</text>
    <text x="1135" y="293" font-size="12" fill="#24292f">1. Unit tests: mvn verify (JaCoCo; Testcontainers/Docker)</text>
    <text x="1135" y="311" font-size="12" fill="#24292f">2. SonarCloud analysis (SONAR_TOKEN)</text>
    <text x="1135" y="329" font-size="12" fill="#24292f">3. Build: JAR como artefacto</text>
    <text x="1135" y="347" font-size="12" fill="#24292f">4. Deploy to Render (solo main): deploy hook + health</text>
    <text x="1135" y="366" font-size="11" fill="#57606a">PR: pasos 1–3 sin despliegue · secretos en GitHub Secrets</text>
    <rect x="1118" y="388" width="334" height="48" rx="4" fill="#ffffff" stroke="#6e7781"/>
    <text x="1285" y="408" text-anchor="middle" font-size="13" font-weight="bold">Dependabot</text>
    <text x="1285" y="426" text-anchor="middle" font-size="11.5" fill="#57606a">PR semanales: Maven · Actions · Docker (OWASP A06)</text>
  </g>

  <!-- ================= SONARCLOUD ================= -->
  <g transform="translate(70,0)">
    <rect x="1100" y="500" width="370" height="130" rx="6" fill="#fdf2f2" stroke="#d3455b" stroke-width="2"/>
    <text x="1285" y="524" text-anchor="middle" font-size="12" fill="#a8293d">«cloud»</text>
    <text x="1285" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d1117">SonarCloud</text>
    <text x="1285" y="570" text-anchor="middle" font-size="12" fill="#37474f">Quality Gate · cobertura (JaCoCo) · vulnerabilidades</text>
    <text x="1285" y="588" text-anchor="middle" font-size="12" fill="#37474f">proyecto Fabrica-escuela-proyectos_Proyecto2026-2</text>
    <text x="1285" y="612" text-anchor="middle" font-size="11.5" fill="#57606a">estado a 2026-10-10: gate OK · 0 issues · 96,1 % de cobertura</text>
  </g>

  <!-- ================= ENTORNO LOCAL ================= -->
  <g transform="translate(70,0)">
    <rect x="1100" y="680" width="370" height="170" rx="6" fill="#fafafa" stroke="#78909c" stroke-width="1.8" stroke-dasharray="7,4"/>
    <text x="1285" y="704" text-anchor="middle" font-size="12" fill="#546e7a">«device» Equipo de desarrollo (perfil dev)</text>
    <rect x="1118" y="718" width="334" height="48" rx="4" fill="#ffffff" stroke="#90a4ae"/>
    <text x="1285" y="739" text-anchor="middle" font-size="12.5" font-weight="bold">./mvnw spring-boot:run (JDK 17)</text>
    <text x="1285" y="756" text-anchor="middle" font-size="11.5" fill="#546e7a">Swagger encendido · logs DEBUG · clave JWT de desarrollo</text>
    <rect x="1118" y="778" width="334" height="56" rx="4" fill="#ffffff" stroke="#90a4ae"/>
    <text x="1285" y="799" text-anchor="middle" font-size="12.5" font-weight="bold">Docker: postgres:16-alpine (docker-compose)</text>
    <text x="1285" y="816" text-anchor="middle" font-size="11.5" fill="#546e7a">pruebas: Testcontainers levanta uno propio</text>
  </g>

  <!-- ================= RUTAS DE COMUNICACIÓN ================= -->
  <!-- cliente -> proxy -->
  <path d="M 280 250 C 310 250, 320 180, 360 180" fill="none" stroke="#37474f" stroke-width="2"/>
  <rect x="240" y="104" width="0" height="0" fill="none"/>
  <text x="298" y="270" font-size="11.5" font-weight="bold" fill="#37474f" transform="rotate(-62 298 270)">HTTPS 443</text>

  <!-- proxy -> contenedor -->
  <line x1="690" y1="202" x2="690" y2="236" stroke="#37474f" stroke-width="2"/>
  <text x="702" y="223" font-size="11.5" font-weight="bold" fill="#37474f">HTTP :$PORT</text>

  <!-- contenedor -> BD -->
  <line x1="690" y1="576" x2="690" y2="630" stroke="#37474f" stroke-width="2"/>
  <text x="702" y="598" font-size="11.5" font-weight="bold" fill="#37474f">JDBC (PostgreSQL) · Flyway al arrancar</text>
  <text x="702" y="615" font-size="11" fill="#546e7a">DB_URL · DB_USERNAME · DB_PASSWORD (variables de entorno)</text>

  <!-- Render -> GitHub: clona el repo y construye la imagen (discontinua) -->
  <path d="M 1020 262 L 1140 262 L 1140 194 L 1170 194" fill="none" stroke="#78909c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1095" y="224" text-anchor="middle" font-size="10" fill="#546e7a">clona el repo</text>
  <text x="1095" y="238" text-anchor="middle" font-size="10" fill="#546e7a">y construye la</text>
  <text x="1095" y="252" text-anchor="middle" font-size="10" fill="#546e7a">imagen Docker</text>

  <!-- Actions -> Render: deploy hook -->
  <path d="M 1170 292 L 1020 292" fill="none" stroke="#37474f" stroke-width="2"/>
  <text x="1110" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">POST deploy hook</text>
  <text x="1110" y="308" text-anchor="middle" font-size="10.5" fill="#546e7a">(URL secreta)</text>

  <!-- Actions -> Render: smoke test -->
  <path d="M 1170 352 L 1020 352" fill="none" stroke="#37474f" stroke-width="2"/>
  <text x="1110" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">GET /actuator/health</text>
  <text x="1110" y="368" text-anchor="middle" font-size="10.5" fill="#546e7a">(smoke test, HTTPS)</text>

  <!-- Actions -> SonarCloud -->
  <line x1="1355" y1="450" x2="1355" y2="500" stroke="#37474f" stroke-width="2"/>
  <text x="1367" y="480" font-size="11.5" font-weight="bold" fill="#37474f">HTTPS · análisis + Quality Gate</text>

  <!-- Dev local -> BD local -->
  <line x1="1355" y1="766" x2="1355" y2="778" stroke="#78909c" stroke-width="2"/>

  <!-- leyenda -->
  <text x="30" y="700" font-size="12" font-weight="bold" fill="#37474f">Notas</text>
  <text x="30" y="722" font-size="11.5" fill="#455a64">* HU-16 (desactivar recurso) la orquesta</text>
  <text x="30" y="738" font-size="11.5" fill="#455a64">  «reservation» sobre «resource» (ADR-007).</text>
  <text x="30" y="760" font-size="11.5" fill="#455a64">• Una sola instancia (plan gratuito): los límites</text>
  <text x="30" y="776" font-size="11.5" fill="#455a64">  de intentos viven en memoria.</text>
  <text x="30" y="798" font-size="11.5" fill="#455a64">• El servicio se duerme a los 15 min sin tráfico</text>
  <text x="30" y="814" font-size="11.5" fill="#455a64">  (primer arranque ≈ 2 min).</text>
  <text x="30" y="836" font-size="11.5" fill="#455a64">• Plan gratuito: 750 h/mes; la base expira a los 30 días.</text>
  <text x="30" y="874" font-size="11" fill="#90a4ae">Fuente editable: diagrama-despliegue.svg · tabla de conexiones: conexiones-diagrama-despliegue.md</text>
