<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1570 960" width="1570" height="960" font-family="Arial, Helvetica, sans-serif">
  <title>Diagrama de despliegue — Plataforma de Reservas de Servicios (Sprint 3)</title>
  <rect width="1570" height="960" fill="#ffffff"/>

  <text x="785" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0d1b2a">Diagrama de despliegue — Plataforma de Reservas de Servicios (Sprint 3 · entrega final)</text>
  <text x="785" y="58" text-anchor="middle" font-size="13" fill="#546e7a">Notación UML: nodos (cajas con estereotipo), artefactos, rutas de comunicación (flechas con protocolo). Línea discontinua = construcción/automatización o elemento futuro. Estado al 2026-11-02.</text>

  <!-- ================= CLIENTE ================= -->
  <g>
    <rect x="30" y="110" width="250" height="330" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
    <text x="155" y="136" text-anchor="middle" font-size="12" fill="#37474f">«device»</text>
    <text x="155" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d1b2a">Cliente</text>
    <rect x="48" y="176" width="214" height="62" rx="4" fill="#ffffff" stroke="#607d8b"/>
    <text x="155" y="200" text-anchor="middle" font-size="13" font-weight="bold">Navegador web</text>
    <text x="155" y="220" text-anchor="middle" font-size="12" fill="#455a64">Swagger UI (/swagger-ui.html)</text>
    <rect x="48" y="252" width="214" height="62" rx="4" fill="#ffffff" stroke="#607d8b"/>
    <text x="155" y="276" text-anchor="middle" font-size="13" font-weight="bold">Postman / Newman</text>
    <text x="155" y="296" text-anchor="middle" font-size="12" fill="#455a64">pruebas de Calidad (REST)</text>
    <rect x="48" y="328" width="214" height="62" rx="4" fill="#fafafa" stroke="#90a4ae" stroke-dasharray="6,4"/>
    <text x="155" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#78909c">Frontend web / móvil</text>
    <text x="155" y="372" text-anchor="middle" font-size="12" fill="#90a4ae">futuro (CORS_ALLOWED_ORIGINS)</text>
    <text x="155" y="420" text-anchor="middle" font-size="12" fill="#546e7a">Todo tráfico lleva JWT (Bearer)</text>
  </g>

  <!-- ================= RENDER ================= -->
  <g>
    <rect x="330" y="90" width="720" height="530" rx="10" fill="#f3f8ff" stroke="#1565c0" stroke-width="2.5"/>
    <text x="350" y="116" font-size="12" fill="#1565c0">«cloud»</text>
    <text x="350" y="136" font-size="17" font-weight="bold" fill="#0d47a1">Render (plan gratuito, detrás de Cloudflare)</text>
    <text x="1030" y="136" text-anchor="end" font-size="12" fill="#546e7a">https://proyecto2026-2-5zoo.onrender.com</text>

    <rect x="360" y="156" width="660" height="46" rx="4" fill="#ffffff" stroke="#1565c0"/>
    <text x="690" y="176" text-anchor="middle" font-size="13" font-weight="bold">Proxy inverso (Cloudflare + Render)</text>
    <text x="690" y="194" text-anchor="middle" font-size="12" fill="#455a64">termina TLS · HTTP→HTTPS · agrega X-Forwarded-For (la app confía solo en rangos privados y de Cloudflare)</text>

    <rect x="360" y="236" width="660" height="370" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.8"/>
    <text x="380" y="258" font-size="12" fill="#1565c0">«execution environment» Web Service (Docker)</text>
    <text x="1000" y="258" text-anchor="end" font-size="12" fill="#546e7a">temurin:17-jre · usuario «app» (sin root) · HEALTHCHECK</text>

    <rect x="380" y="272" width="620" height="320" rx="4" fill="#e8f1fb" stroke="#1565c0"/>
    <text x="396" y="294" font-size="12" fill="#1565c0">«artifact»</text>
    <text x="396" y="313" font-size="15" font-weight="bold" fill="#0d1b2a">reservas-backend.jar — Spring Boot 4.1.1 · Java 17 · monolito modular</text>

    <rect x="396" y="326" width="588" height="44" rx="3" fill="#ffffff" stroke="#90a4ae"/>
    <text x="690" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">Filtros y seguridad (orden de ejecución)</text>
    <text x="690" y="361" text-anchor="middle" font-size="11.5" fill="#455a64">Correlación (X-Request-Id) → tope 64 KB → CORS/cabeceras → JWT + sesión → MFA admin → rol → pertenencia</text>

    <!-- módulos: fila 1 -->
    <rect x="396" y="382" width="116" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="454" y="402" text-anchor="middle" font-size="13" font-weight="bold">identity</text>
    <text x="454" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">HU-01,02,04,05,06 · MFA</text>
    <rect x="522" y="382" width="116" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="580" y="402" text-anchor="middle" font-size="13" font-weight="bold">provider</text>
    <text x="580" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">HU-03,06,07,08</text>
    <rect x="648" y="382" width="116" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="706" y="402" text-anchor="middle" font-size="13" font-weight="bold">resource</text>
    <text x="706" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">HU-14,15,17,19,21*</text>
    <rect x="774" y="382" width="116" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="832" y="402" text-anchor="middle" font-size="13" font-weight="bold">service</text>
    <text x="832" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">HU-09,10,12,13,18,20</text>
    <rect x="900" y="382" width="84" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="942" y="402" text-anchor="middle" font-size="13" font-weight="bold">audit</text>
    <text x="942" y="418" text-anchor="middle" font-size="10.5" fill="#37474f">eventos</text>
    <!-- módulos: fila 2 -->
    <rect x="396" y="436" width="242" height="44" rx="3" fill="#bbdefb" stroke="#1565c0"/>
    <text x="517" y="456" text-anchor="middle" font-size="13" font-weight="bold">reservation</text>
    <text x="517" y="472" text-anchor="middle" font-size="10.5" fill="#37474f">HU-22..28 · orquesta 11,16,21*,28 · anti-overbooking</text>
    <rect x="648" y="436" width="242" height="44" rx="3" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="769" y="456" text-anchor="middle" font-size="13" font-weight="bold">report (nuevo, Sprint 3)</text>
    <text x="769" y="472" text-anchor="middle" font-size="10.5" fill="#37474f">HU-29..34 · solo lectura · sin tablas (ADR-008)</text>
    <rect x="900" y="436" width="84" height="44" rx="3" fill="#cfd8dc" stroke="#546e7a"/>
    <text x="942" y="456" text-anchor="middle" font-size="13" font-weight="bold">common</text>
    <text x="942" y="472" text-anchor="middle" font-size="10.5" fill="#37474f">errores · config</text>

    <rect x="396" y="492" width="588" height="86" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-dasharray="5,3"/>
    <text x="690" y="511" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">Documentación y operación</text>
    <text x="690" y="528" text-anchor="middle" font-size="11.5" fill="#455a64">springdoc: /v3/api-docs + /swagger-ui.html (SWAGGER_ENABLED) · 48 endpoints en 9 grupos</text>
    <text x="690" y="545" text-anchor="middle" font-size="11.5" fill="#455a64">Actuator: solo /actuator/health público · logs JSON con traceId (perfil prod)</text>
    <text x="690" y="562" text-anchor="middle" font-size="11.5" fill="#455a64">Arranque bloqueado sin JWT_SECRET/DB_PASSWORD reales (ProductionSafetyGuard)</text>
  </g>

  <!-- ================= NEON ================= -->
  <g>
    <rect x="330" y="680" width="720" height="250" rx="10" fill="#effaf6" stroke="#00a67e" stroke-width="2.5"/>
    <text x="350" y="706" font-size="12" fill="#00795c">«cloud»</text>
    <text x="350" y="726" font-size="17" font-weight="bold" fill="#00563f">Neon (PostgreSQL 16 serverless, plan gratuito) · desde el 2026-10-25</text>
    <rect x="360" y="740" width="660" height="176" rx="6" fill="#ffffff" stroke="#00a67e" stroke-width="1.8"/>
    <text x="380" y="760" font-size="12" fill="#00795c">«database» reservas · host directo (sin -pooler) · sslmode=require</text>
    <rect x="380" y="772" width="320" height="130" rx="4" fill="#e8f1fb" stroke="#1565c0"/>
    <text x="396" y="792" font-size="12" fill="#1565c0">«schema» public (Flyway V1–V14)</text>
    <text x="396" y="812" font-size="12" fill="#37474f">users · roles · user_roles · sessions · mfa</text>
    <text x="396" y="829" font-size="12" fill="#37474f">providers · businesses (+ perfil, V13) · services</text>
    <text x="396" y="846" font-size="12" fill="#37474f">resources · service_resources · resource_availability</text>
    <text x="396" y="863" font-size="12" fill="#37474f">resource_closures (V14) · bookings · audit_logs</text>
    <text x="396" y="887" font-size="12" font-weight="bold" fill="#37474f">UUID · TIMESTAMPTZ · ON DELETE SET NULL</text>
    <rect x="714" y="772" width="290" height="130" rx="4" fill="#fff8e1" stroke="#f9a825"/>
    <text x="728" y="792" font-size="12" fill="#8d6e00">Reglas en la base de datos</text>
    <text x="728" y="812" font-size="12" fill="#37474f">EXCLUDE USING gist (btree_gist):</text>
    <text x="728" y="829" font-size="12" fill="#37474f">· sin reservas traslapadas por recurso</text>
    <text x="728" y="846" font-size="12" fill="#37474f">· sin cierres traslapados por recurso</text>
    <text x="728" y="866" font-size="12" fill="#37474f">CHECK de rangos, estados, tipos, teléfono</text>
    <text x="728" y="886" font-size="12" fill="#37474f">Hibernate: ddl-auto = validate</text>
  </g>

  <!-- ================= GITHUB ================= -->
  <g transform="translate(70,0)">
    <rect x="1100" y="110" width="370" height="340" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
    <text x="1285" y="134" text-anchor="middle" font-size="12" fill="#24292f">«cloud»</text>
    <text x="1285" y="154" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d1117">GitHub</text>
    <rect x="1118" y="170" width="334" height="48" rx="4" fill="#ffffff" stroke="#6e7781"/>
    <text x="1285" y="191" text-anchor="middle" font-size="13" font-weight="bold">Repositorio (público) · rama main</text>
    <text x="1285" y="208" text-anchor="middle" font-size="11.5" fill="#57606a">Fabrica-escuela-proyectos/Proyecto2026-2 · PR + revisión</text>
    <rect x="1118" y="230" width="334" height="146" rx="4" fill="#e6f4ea" stroke="#2da44e"/>
    <text x="1135" y="250" font-size="12" fill="#1a7f37">«execution environment» GitHub Actions · ubuntu-latest</text>
    <text x="1135" y="272" font-size="12.5" font-weight="bold" fill="#24292f">CI/CD Pipeline (build.yml)</text>
    <text x="1135" y="293" font-size="12" fill="#24292f">1. Pruebas: mvn verify (JaCoCo; Testcontainers)</text>
    <text x="1135" y="311" font-size="12" fill="#24292f">2. SonarCloud analysis (SONAR_TOKEN)</text>
    <text x="1135" y="329" font-size="12" fill="#24292f">3. Build: JAR como artefacto</text>
    <text x="1135" y="347" font-size="12" fill="#24292f">4. Deploy (solo main): hook + health (timeout 15 min)</text>
    <text x="1135" y="366" font-size="11" fill="#57606a">PR: pasos 1–3 · interruptor DEPLOY_ENABLED · secretos</text>
    <rect x="1118" y="388" width="334" height="48" rx="4" fill="#ffffff" stroke="#6e7781"/>
    <text x="1285" y="408" text-anchor="middle" font-size="13" font-weight="bold">Dependabot</text>
    <text x="1285" y="426" text-anchor="middle" font-size="11.5" fill="#57606a">PR semanales: Maven · Actions · Docker (OWASP A06)</text>
  </g>

  <!-- ================= SONARCLOUD ================= -->
  <g transform="translate(70,0)">
    <rect x="1100" y="500" width="370" height="120" rx="6" fill="#fdf2f2" stroke="#d3455b" stroke-width="2"/>
    <text x="1285" y="524" text-anchor="middle" font-size="12" fill="#a8293d">«cloud»</text>
    <text x="1285" y="544" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d1117">SonarCloud</text>
    <text x="1285" y="570" text-anchor="middle" font-size="12" fill="#37474f">Quality Gate · cobertura (JaCoCo) · vulnerabilidades</text>
    <text x="1285" y="588" text-anchor="middle" font-size="12" fill="#37474f">proyecto Fabrica-escuela-proyectos_Proyecto2026-2</text>
    <text x="1285" y="606" text-anchor="middle" font-size="11.5" fill="#57606a">metas: cobertura ≥ 65 % · deuda ≤ 2 días · 0 críticas</text>
  </g>

  <!-- ================= ENTORNO LOCAL ================= -->
  <g transform="translate(70,0)">
    <rect x="1100" y="680" width="370" height="170" rx="6" fill="#fafafa" stroke="#78909c" stroke-width="1.8" stroke-dasharray="7,4"/>
    <text x="1285" y="704" text-anchor="middle" font-size="12" fill="#546e7a">«device» Equipo de desarrollo (perfil dev)</text>
    <rect x="1118" y="718" width="334" height="48" rx="4" fill="#ffffff" stroke="#90a4ae"/>
    <text x="1285" y="739" text-anchor="middle" font-size="12.5" font-weight="bold">./mvnw spring-boot:run (JDK 17)</text>
    <text x="1285" y="756" text-anchor="middle" font-size="11.5" fill="#546e7a">Swagger encendido · logs DEBUG · clave JWT de desarrollo</text>
    <rect x="1118" y="778" width="334" height="56" rx="4" fill="#ffffff" stroke="#90a4ae"/>
    <text x="1285" y="799" text-anchor="middle" font-size="12.5" font-weight="bold">Docker: postgres:16-alpine (docker-compose)</text>
    <text x="1285" y="816" text-anchor="middle" font-size="11.5" fill="#546e7a">pruebas: Testcontainers levanta uno propio</text>
  </g>

  <!-- ================= RUTAS DE COMUNICACIÓN ================= -->
  <path d="M 280 250 C 310 250, 320 180, 360 180" fill="none" stroke="#37474f" stroke-width="2"/>
  <text x="298" y="270" font-size="11.5" font-weight="bold" fill="#37474f" transform="rotate(-62 298 270)">HTTPS 443</text>

  <line x1="690" y1="202" x2="690" y2="236" stroke="#37474f" stroke-width="2"/>
  <text x="702" y="223" font-size="11.5" font-weight="bold" fill="#37474f">HTTP :$PORT</text>

  <!-- contenedor (Render) -> base (Neon) -->
  <line x1="960" y1="606" x2="960" y2="740" stroke="#37474f" stroke-width="2"/>
  <text x="948" y="642" text-anchor="end" font-size="11.5" font-weight="bold" fill="#37474f">JDBC sobre TLS (sslmode=require) · Flyway al arrancar</text>
  <text x="948" y="659" text-anchor="end" font-size="11" fill="#546e7a">DB_URL · DB_USERNAME · DB_PASSWORD (variables de entorno) · Hikari MAX_LIFETIME 4 min</text>

  <path d="M 1020 262 L 1140 262 L 1140 194 L 1170 194" fill="none" stroke="#78909c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1095" y="224" text-anchor="middle" font-size="10" fill="#546e7a">clona el repo</text>
  <text x="1095" y="238" text-anchor="middle" font-size="10" fill="#546e7a">y construye la</text>
  <text x="1095" y="252" text-anchor="middle" font-size="10" fill="#546e7a">imagen Docker</text>

  <path d="M 1170 292 L 1020 292" fill="none" stroke="#37474f" stroke-width="2"/>
  <text x="1110" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">POST deploy hook</text>
  <text x="1110" y="308" text-anchor="middle" font-size="10.5" fill="#546e7a">(URL secreta)</text>

  <path d="M 1170 352 L 1020 352" fill="none" stroke="#37474f" stroke-width="2"/>
  <text x="1110" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">GET /actuator/health</text>
  <text x="1110" y="368" text-anchor="middle" font-size="10.5" fill="#546e7a">(smoke test, curl -m 15)</text>

  <line x1="1355" y1="450" x2="1355" y2="500" stroke="#37474f" stroke-width="2"/>
  <text x="1367" y="480" font-size="11.5" font-weight="bold" fill="#37474f">HTTPS · análisis + Quality Gate</text>

  <line x1="1355" y1="766" x2="1355" y2="778" stroke="#78909c" stroke-width="2"/>

  <!-- notas -->
  <text x="30" y="500" font-size="12" font-weight="bold" fill="#37474f">Notas</text>
  <text x="30" y="522" font-size="11.5" fill="#455a64">* Lo que cancela reservas (HU-11, 16, 21, 28)</text>
  <text x="30" y="538" font-size="11.5" fill="#455a64">  lo orquesta «reservation» (ADR-007).</text>
  <text x="30" y="560" font-size="11.5" fill="#455a64">• Una sola instancia: los límites de intentos</text>
  <text x="30" y="576" font-size="11.5" fill="#455a64">  viven en memoria.</text>
  <text x="30" y="598" font-size="11.5" fill="#455a64">• Render gratuito: 750 h/mes; el servicio se</text>
  <text x="30" y="614" font-size="11.5" fill="#455a64">  duerme a los 15 min (arranque ≈ 2 min).</text>
  <text x="30" y="636" font-size="11.5" fill="#455a64">• La base pasó de Render a Neon el 25-oct:</text>
  <text x="30" y="652" font-size="11.5" fill="#455a64">  la de Render expira a los 30 días; Neon no.</text>
  <text x="30" y="674" font-size="11.5" fill="#455a64">  Neon se duerme a los 5 min sin uso.</text>
  <text x="30" y="940" font-size="11" fill="#90a4ae">Fuente editable: diagrama-despliegue.svg · tabla de conexiones: conexiones-diagrama-despliegue.md</text>

