# Workflow name
name: CI/CD Pipeline
on:
  # Manually trigger workflow runs
  workflow_dispatch:
  # Push a main y validación de cada PR hacia main (Lineamientos: PR con CI verde)
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# El proyecto Maven vive en reservas-backend/, no en la raíz del repo
defaults:
  run:
    working-directory: reservas-backend

jobs:
  # Test's job
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Corre las pruebas unitarias y las de integración (Testcontainers usa el
      # Docker que ya trae ubuntu-latest) y genera el reporte de JaCoCo
      - name: Run Tests
        run: mvn -B verify

  # Sonar's job
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: Sonar lo necesita para atribuir código nuevo y blame
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # projectKey, organization y host están en las propiedades del pom.xml
      # Un solo comando: compila, corre pruebas, genera jacoco.xml y lo analiza
      - name: Build and SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # Build's job
  build:
    name: Build
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Las pruebas ya corrieron en los jobs anteriores
      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: reservas-backend
          # upload-artifact no usa working-directory: la ruta es desde la raíz del repo
          path: reservas-backend/target/reservas-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
