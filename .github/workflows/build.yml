# Workflow name
name: CI/CD Pipeline
on:
  # Manually trigger workflow runs
  workflow_dispatch:
  # Push a main y validación de cada PR hacia main (Lineamientos: PR con CI verde)
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# El proyecto Maven vive en reservas-backend/, no en la raíz del repo
defaults:
  run:
    working-directory: reservas-backend

jobs:
  # Test's job
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Corre las pruebas unitarias y las de integración (Testcontainers usa el
      # Docker que ya trae ubuntu-latest) y genera el reporte de JaCoCo
      - name: Run Tests
        run: mvn -B verify

  # Sonar's job
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historial completo: Sonar lo necesita para atribuir código nuevo y blame
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # projectKey, organization y host están en las propiedades del pom.xml
      # Un solo comando: compila, corre pruebas, genera jacoco.xml y lo analiza
      - name: Build and SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # Build's job
  build:
    name: Build
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Las pruebas ya corrieron en los jobs anteriores
      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: reservas-backend
          # upload-artifact no usa working-directory: la ruta es desde la raíz del repo
          path: reservas-backend/target/reservas-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  # Deploy's job: solo en main (nunca en PR) y solo si tests, Sonar y build pasaron.
  # Interruptor sin tocar código: variable del repositorio DEPLOY_ENABLED=false (Settings >
  # Secrets and variables > Actions > Variables) lo salta mientras no haya dónde desplegar
  # (p. ej. el plan gratuito de Render agotado); con la variable ausente o en true despliega.
  deploy:
    name: Deploy to Render
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    # Tope duro: un servicio que acepta la conexión pero no responde ya dejó ejecuciones colgadas horas.
    timeout-minutes: 15
    # Varias fusiones seguidas (p. ej. los PR de Dependabot) no deben apilar despliegues: gana el último.
    concurrency:
      group: deploy-render
      cancel-in-progress: true
    # Este job no hace checkout: anula el working-directory global
    defaults:
      run:
        working-directory: .
    env:
      APP_URL: https://proyecto2026-2-5zoo.onrender.com
    steps:
      # El deploy hook es una URL secreta de Render (Settings > Deploy Hook).
      # Render reconstruye la imagen con reservas-backend/Dockerfile (compila el
      # JAR y lo empaqueta en un contenedor JRE 17) y la despliega.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl -fsS -m 30 -X POST "$RENDER_DEPLOY_HOOK_URL"

      # Smoke test: espera a que la app responda UP (el build en Render tarda
      # unos minutos y el plan gratis puede estar dormido)
      - name: Wait for application health
        run: |
          for i in $(seq 1 40); do
            # -m 15: sin tiempo límite, un servidor que no responde colgaba el paso para siempre
            status=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "$APP_URL/actuator/health" || true)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Aplicación desplegada y saludable"
              exit 0
            fi
            sleep 15
          done
          echo "::error::La aplicación no respondió UP en 10 minutos"
          exit 1

  # Smoke test post-deploy: corre SOLO un subconjunto de la colección de Postman contra la instancia ya
  # desplegada en Render (registro, configuración del negocio, catálogo, reserva y, si hay secretos de
  # administrador, la limpieza). Las demás reglas las prueban las pruebas de `mvn verify` antes del deploy.
  # Corre después del despliegue, así que avisa pero no lo bloquea. Solo corre si el deploy se
  # ejecutó y salió bien (se salta con DEPLOY_ENABLED=false o en PR).
  # Secrets opcionales (Settings > Secrets and variables > Actions): E2E_ADMIN_EMAIL, E2E_ADMIN_PASSWORD
  # y E2E_ADMIN_TOTP_SECRET. Con ellos corre también la carpeta 08 (HU-05/28), que además BORRA los
  # usuarios de prueba; sin ellos la carpeta se omite sola y los usuarios qa.* quedan en la base.
  e2e-render:
    name: API tests on Render
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Una corrida crea 4 cuentas y el registro está limitado a 5 por IP cada 10 min: nunca dos a la vez.
    concurrency:
      group: e2e-render
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ubuntu-latest ya trae Node.js; Newman es el ejecutor de Postman por línea de comandos.
      - name: Run Postman collection against Render
        env:
          ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
        run: |
          npx --yes newman@6 run docs/postman/Reservas-Sprint2.postman_collection.json \
            -e docs/postman/Reservas-Render.postman_environment.json \
            --folder "00 · Preparación" \
            --folder "01 · Registro y acceso (HU-01, 02, 03, 06)" \
            --folder "02 · Configuración del negocio (HU-08, 09, 14, 18, 19)" \
            --folder "04 · Catálogo y disponibilidad (HU-13, 20)" \
            --folder "05 · Reservas (HU-22, 23, 24)" \
            --folder "08 · Administrador y eliminación de cuentas (HU-05, 28) — OPCIONAL" \
            --env-var "adminEmail=$ADMIN_EMAIL" \
            --env-var "adminPassword=$ADMIN_PASSWORD" \
            --env-var "adminTotpSecret=$ADMIN_TOTP_SECRET" \
            --timeout-request 150000 \
            -r cli,junit --reporter-junit-export newman-results.xml

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-results
          path: newman-results.xml
          if-no-files-found: ignore
