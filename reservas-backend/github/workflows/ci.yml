name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v3

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Dar permisos al ejecutable de Maven
        run: chmod +x mvnw

      - name: 4. Ejecutar pruebas y compilar
        # Este comando ejecuta todas tus pruebas unitarias y de integración.
        # Docker ya viene instalado en 'ubuntu-latest', así que Testcontainers funcionará perfectamente.
        run: ./mvnw clean verify

      - name: 5. Análisis de calidad con SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub lo provee automáticamente
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # El secreto que acabas de crear
        run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=765747aa7c238945e6d7f01fb8349a2567f42d66