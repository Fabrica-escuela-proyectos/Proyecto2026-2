# Perfil usado por las pruebas de integracion (UserRegistrationIntegrationTest).
# Las propiedades reales de datasource las inyecta @DynamicPropertySource
# apuntando al contenedor PostgreSQL levantado por Testcontainers; este
# archivo solo fija comportamiento de JPA/Flyway para el entorno de pruebas.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: test-only-secret-not-for-production-use-change-me-32b
  rate-limit:
    registration:
      # Las pruebas de integración registran decenas de cuentas desde la misma
      # IP (127.0.0.1) dentro de un mismo contexto de Spring; con el límite de
      # producción (5) los registros posteriores recibirían 429. El
      # comportamiento del límite se prueba aparte (AttemptLimiterTest y
      # RegistrationRateLimitIntegrationTest, que fija su propio valor).
      max-attempts: 1000
