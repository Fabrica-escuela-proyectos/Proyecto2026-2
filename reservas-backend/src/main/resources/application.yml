spring:
  application:
    name: reservas-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservas}
    username: ${DB_USERNAME:reservas_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    # ADR-002-autenticacion-y-sesiones.md: token JWT de 1 hora. Sin valor
    # por defecto en produccion (dev/test usan un valor de relleno abajo
    # solo para que la app arranque local/en pruebas sin configurar nada);
    # JWT_SECRET debe definirse como variable de entorno real. No hay
    # filtro que use este secreto todavia en Sprint 1 (ver JwtTokenProvider).
    secret: ${JWT_SECRET:}
  # Control de fuerza bruta en memoria (una sola instancia). Los valores por
  # defecto están también en el código (RegistrationRateLimiter y
  # AuthAttemptLimiter); se exponen aquí para poder ajustarlos por entorno.
  rate-limit:
    registration:        # POST /users y /providers: cada intento cuenta; el (max+1)-ésimo se rechaza
      max-attempts: ${RATE_LIMIT_REGISTRATION_MAX_ATTEMPTS:5}
      window-minutes: 10
      block-minutes: 15
    auth:                # login, código MFA y operaciones sensibles: cuentan los fallos
      max-attempts: ${RATE_LIMIT_AUTH_MAX_ATTEMPTS:5}
      window-minutes: 15
      block-minutes: 15

# Documentación OpenAPI/Swagger (ARQ-01). Apagada por defecto: solo se expone si SWAGGER_ENABLED=true
# (perfil dev y pruebas la encienden; en Render, solo mientras dure una demostración). OWASP A05.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
  # Regla de seguridad (Lineamientos 6.2): nunca loguear contrasenas, tokens
  # ni secretos completos. No agregar loggers de DEBUG sobre Spring Security
  # o Hibernate en produccion sin revisar que no expongan parametros de
  # consulta con datos sensibles.
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
