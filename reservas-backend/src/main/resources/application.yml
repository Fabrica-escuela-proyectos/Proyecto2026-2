spring:
  application:
    name: reservas-backend
  # Sin perfil por defecto (SEC-05): una configuración «de producción» es lo que arranca si nadie elige otra
  # cosa, y exige DB_PASSWORD y JWT_SECRET reales (ver ProductionSafetyGuard). Para trabajar en local:
  # SPRING_PROFILES_ACTIVE=dev (./mvnw spring-boot:run ya lo activa; las pruebas usan el perfil test).
  autoconfigure:
    # La autenticación es propia (JWT + tabla de sesiones). Sin esto Spring Boot crea un usuario en memoria con
    # una contraseña generada que imprime en el log en cada arranque (SEC-03). Excluirla evita además declarar
    # un UserDetailsService que lance UsernameNotFoundException (Sonar S5804: enumeración de usuarios).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservas}
    username: ${DB_USERNAME:reservas_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Render (y cualquier proxy inverso) termina TLS y reenvía X-Forwarded-For/-Proto. Con «native» Tomcat
  # resuelve la IP y el esquema reales del cliente (OWASP-03): los límites de intentos y la auditoría dejan
  # de ver la IP del proxy. Tomcat solo confía en esas cabeceras si vienen de un proxy interno (rangos privados).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Proxies de confianza (regex): los privados de siempre y los rangos de Cloudflare, porque Render recibe el
      # tráfico a través de Cloudflare. Sin los de Cloudflare la aplicación guardaba la IP de su borde (104.23.x.x)
      # en lugar de la del cliente (verificado en Render el 2026-10-12). Se genera con
      # docs/seguridad/generar_proxies_confiables.py; Tomcat toma como cliente la primera IP, de derecha a
      # izquierda, que NO coincide: un cliente no puede falsear su IP anteponiendo valores a X-Forwarded-For.
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}|173\.245\.(?:4[8-9]|5[0-9]|6[0-3])\.\d{1,3}|103\.21\.24[4-7]\.\d{1,3}|103\.22\.20[0-3]\.\d{1,3}|103\.31\.[4-7]\.\d{1,3}|141\.101\.(?:6[4-9]|7[0-9]|8[0-9]|9[0-9]|10[0-9]|11[0-9]|12[0-7])\.\d{1,3}|108\.162\.(?:19[2-9]|20[0-9]|21[0-9]|22[0-9]|23[0-9]|24[0-9]|25[0-5])\.\d{1,3}|190\.93\.(?:24[0-9]|25[0-5])\.\d{1,3}|188\.114\.(?:9[6-9]|10[0-9]|11[0-1])\.\d{1,3}|197\.234\.24[0-3]\.\d{1,3}|198\.41\.(?:12[8-9]|13[0-9]|14[0-9]|15[0-9]|16[0-9]|17[0-9]|18[0-9]|19[0-9]|20[0-9]|21[0-9]|22[0-9]|23[0-9]|24[0-9]|25[0-5])\.\d{1,3}|162\.15[8-9]\.\d{1,3}\.\d{1,3}|104\.(?:1[6-9]|2[0-3])\.\d{1,3}\.\d{1,3}|104\.2[4-7]\.\d{1,3}\.\d{1,3}|172\.(?:6[4-9]|7[0-1])\.\d{1,3}\.\d{1,3}|131\.0\.7[2-5]\.\d{1,3}|2400:cb00:[0-9a-f:]*|2606:4700:[0-9a-f:]*|2803:f800:[0-9a-f:]*|2405:b500:[0-9a-f:]*|2405:8100:[0-9a-f:]*|2a06:98c[01234567]:[0-9a-f:]*|2c0f:f248:[0-9a-f:]*'

security:
  # Tamaño máximo del cuerpo de una petición (OWASP-02, A04): el mayor cuerpo legítimo (horario semanal o
  # 100 ids de recursos) ocupa unos pocos KB. Mayor -> 413.
  request:
    max-body-bytes: ${MAX_REQUEST_BODY_BYTES:65536}
  # Orígenes del navegador autorizados (CORS), separados por comas. Vacío (por defecto) = ninguno: la API
  # no responde a navegadores de otros orígenes hasta que el frontend tenga dominio (p. ej. https://app.example.com).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # ADR-002-autenticacion-y-sesiones.md: token JWT de 1 hora. Sin valor
    # por defecto en produccion (dev/test usan un valor de relleno abajo
    # solo para que la app arranque local/en pruebas sin configurar nada);
    # JWT_SECRET debe definirse como variable de entorno real. No hay
    # filtro que use este secreto todavia en Sprint 1 (ver JwtTokenProvider).
    secret: ${JWT_SECRET:}
  # Control de fuerza bruta en memoria (una sola instancia). Los valores por
  # defecto están también en el código (RegistrationRateLimiter y
  # AuthAttemptLimiter); se exponen aquí para poder ajustarlos por entorno.
  rate-limit:
    registration:        # POST /users y /providers: cada intento cuenta; el (max+1)-ésimo se rechaza
      max-attempts: ${RATE_LIMIT_REGISTRATION_MAX_ATTEMPTS:5}
      window-minutes: 10
      block-minutes: 15
    auth:                # login, código MFA y operaciones sensibles: cuentan los fallos
      max-attempts: ${RATE_LIMIT_AUTH_MAX_ATTEMPTS:5}
      window-minutes: 15
      block-minutes: 15

# Documentación OpenAPI/Swagger (ARQ-01). Apagada por defecto: solo se expone si SWAGGER_ENABLED=true
# (perfil dev y pruebas la encienden; en Render, solo mientras dure una demostración). OWASP A05.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
  # Regla de seguridad (Lineamientos 6.2): nunca loguear contrasenas, tokens
  # ni secretos completos. No agregar loggers de DEBUG sobre Spring Security
  # o Hibernate en produccion sin revisar que no expongan parametros de
  # consulta con datos sensibles.
  pattern:
    console: "%d{ISO8601} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
