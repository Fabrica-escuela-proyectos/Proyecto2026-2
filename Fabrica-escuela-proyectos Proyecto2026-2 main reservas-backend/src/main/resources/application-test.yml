# Perfil usado por las pruebas de integracion (UserRegistrationIntegrationTest).
# Las propiedades reales de datasource las inyecta @DynamicPropertySource
# apuntando al contenedor PostgreSQL levantado por Testcontainers; este
# archivo solo fija comportamiento de JPA/Flyway para el entorno de pruebas.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: test-only-secret-not-for-production-use-change-me-32b
