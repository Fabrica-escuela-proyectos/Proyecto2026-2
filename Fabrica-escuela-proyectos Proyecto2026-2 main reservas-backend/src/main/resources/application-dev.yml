spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.codefactory.reservas: DEBUG

security:
  jwt:
    # Valor de relleno SOLO para desarrollo local; nunca reutilizar en un
    # entorno desplegado. JwtTokenProvider exige HMAC-SHA con clave de al
    # menos 256 bits.
    secret: ${JWT_SECRET:dev-only-secret-not-for-production-use-change-me-32b}
